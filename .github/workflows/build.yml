name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleVip-Next-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleVip-Next-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Notify Telegram Channel
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import shutil
          import subprocess

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("Telegram secrets not configured; skipping notification.")
              raise SystemExit(0)

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "main")
          ref_type = os.environ.get("GITHUB_REF_TYPE", "branch")
          sha = os.environ.get("GITHUB_SHA", "")[:7]
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          before = os.environ.get("EVENT_BEFORE", "").strip()

          commits = []
          if before and set(before) != {"0"}:
              res = subprocess.run(
                  ["git", "log", "--pretty=format:%h %s", f"{before}..HEAD"],
                  capture_output=True, text=True
              )
              if res.returncode == 0 and res.stdout.strip():
                  commits = [line.strip() for line in res.stdout.strip().splitlines() if line.strip()]
          if not commits:
              res = subprocess.run(
                  ["git", "log", "-n", "1", "--pretty=format:%h %s"],
                  capture_output=True, text=True
              )
              if res.returncode == 0 and res.stdout.strip():
                  commits = [res.stdout.strip()]

          max_items = 8
          bullet_lines = []
          for c in commits[:max_items]:
              parts = c.split(" ", 1)
              c_hash = html.escape(parts[0])
              c_msg = html.escape(parts[1]) if len(parts) > 1 else ""
              bullet_lines.append(f"• <code>{c_hash}</code> {c_msg}")
          if len(commits) > max_items:
              bullet_lines.append(f"• ... (+{len(commits) - max_items} more commits)")
          changes_text = "\n".join(bullet_lines) if bullet_lines else "• Build completed"

          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"
          release_url = f"https://github.com/{repo}/releases/tag/{ref_name}" if ref_type == "tag" else ""

          header = f"🚀 <b>TeleVip Next Build</b> (<code>{html.escape(ref_name)}</code> @ <code>{html.escape(sha)}</code>)"
          footer = f'\n\n🔗 <a href="{html.escape(run_url)}">GitHub Actions Run</a>'
          if release_url:
              footer += f'  |  <a href="{html.escape(release_url)}">Release</a>'

          caption = f"{header}\n\n<b>Changes:</b>\n{changes_text}{footer}"

          def tg_curl_post(endpoint, form_args, max_time=120):
              res = subprocess.run([
                  "curl", "-sS", "-f",
                  "-4", "--http1.1",
                  "--connect-timeout", "15",
                  "--max-time", str(max_time),
                  "--retry", "4",
                  "--retry-all-errors",
                  "--retry-delay", "3",
                  "--form-string", f"chat_id={chat_id}",
                  "--form-string", "parse_mode=HTML",
                  *form_args,
                  f"https://api.telegram.org/bot{token}/{endpoint}",
              ], capture_output=True, text=True)
              if res.returncode != 0:
                  raise RuntimeError(f"curl {endpoint} failed: {res.stderr}")
              data = json.loads(res.stdout)
              if not data.get("ok"):
                  raise RuntimeError(f"Telegram {endpoint} failed: {data}")
              print(f"Telegram {endpoint} ok:", data["result"].get("message_id"))

          def tg_post_message(text):
              tg_curl_post("sendMessage", [
                  "--form-string", f"text={text}",
                  "--form-string", "disable_web_page_preview=true",
              ], max_time=60)

          apk_src = "app/build/outputs/apk/debug/app-debug.apk"
          if not os.path.exists(apk_src):
              tg_post_message(caption[:4096])
              raise SystemExit(0)

          safe_ref = "".join(ch if ch.isalnum() or ch in "._-" else "-" for ch in ref_name)
          apk_upload = f"/tmp/TeleVip-Next-{safe_ref}-{sha}.apk"
          shutil.copyfile(apk_src, apk_upload)

          doc_caption = caption
          if len(caption) > 1024:
              tg_post_message(caption[:4096])
              doc_caption = f"{header}{footer}"

          tg_curl_post("sendDocument", [
              "--form-string", f"caption={doc_caption[:1024]}",
              "-F", f"document=@{apk_upload}",
          ], max_time=120)
          PY
